<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyGuard Municipal</title>
    <meta
      name="description"
      content="Accueil statique de secours pour KeyGuard Municipal pendant que Vercel charge l'application Next.js."
    />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6f9;
        color: #082640;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 720px;
        border: 1px solid #d8e2ec;
        border-radius: 24px;
        background: #ffffff;
        padding: 40px;
        box-shadow: 0 16px 40px rgba(8, 38, 64, 0.12);
      }

      p:first-child {
        margin: 0 0 12px;
        color: #124a7c;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1;
      }

      p:last-child {
        margin: 18px 0 0;
        color: #334155;
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Service municipal de garde</p>
      <h1>KeyGuard Municipal</h1>
      <p>
        Page d'accueil de secours. Le projet est configuré pour être construit par Vercel avec Next.js et afficher
        l'application complète sur la route racine.
      </p>
    </main>
  </body>
</html>
